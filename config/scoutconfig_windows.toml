# Global scout configuration. Auto-created on first run at
# <os user config dir>/scout/scoutconfig.toml - edit freely.

[embedder]
# Relative paths here are resolved against the running scout binary's own
# directory (not the working directory), since these assets ship
# alongside the binary in scout's distributed archive.
model_path       = "models/model_qint8_avx512_vnni.onnx"
tokenizer_path   = "models/tokenizer.json"
ort_library_path = "third_party/onnxruntime/onnxruntime.dll"
batch_size       = 32

[media]
# Directory holding the CLIP model, resolved against the running scout
# binary's own directory like the embedder paths above, and shipped in the
# same archive. It is never fetched at runtime: a directory missing any of
# its files is an error, not a download.
#
# Set this to "" to turn media support off - no media worker is started,
# media files are skipped at index time, and `find` returns text results
# only. A path that doesn't exist has the same effect, so an install
# without the media half of the archive degrades to text-only.
model_dir = "models/media"

# Closed list, same convention as index.allowed_extensions below: a file
# is only sent to the media embedder if its extension is here.
allowed_extensions = [".jpg", ".jpeg", ".png", ".heic", ".heif"]

[db]
# Relative paths are resolved against this config file's own directory.
path = "scout.db"

[index]
# Files larger than this are skipped (recorded in `files` with
# status = "skipped") rather than embedded. Applies to any extension not
# overridden below.
max_file_size_mb = 2


# Closed list by design: a file is only indexed if its extension is here.
# Add an extension to opt it in - safer than trying to enumerate every
# binary format that should be excluded.
allowed_extensions = [
    ".txt", ".md", ".markdown", ".rst",
    ".go", ".py", ".js", ".jsx", ".ts", ".tsx",
    ".java", ".c", ".h", ".cpp", ".hpp", ".rs",
    ".rb", ".php", ".sh", ".sql",
    ".html", ".css", ".scss",
    ".json", ".yaml", ".yml", ".toml", ".xml",
    ".swift", ".kt",
    ".pdf", ".docx",
]

# Directories skipped at any depth, matched as globs against the directory
# name. A .gitignore in the indexed directory applies on top of this.
# Dot-prefixed entries only matter if index_hidden_dirs is turned on.
ignore_dirs = [
    # Version control
    ".git", ".svn", ".hg",

    # Dependencies and vendored trees
    "node_modules", "vendor", "third_party", "_vendored",
    "Pods", "Carthage", "site-packages", ".venv", "venv",

    # Build output
    "dist", "build", "out", "target", ".next", "cmake-build-*",

    # Caches and tool state
    "__pycache__", ".cache", "cache", ".gradle", ".m2", ".terraform",
    ".tox", ".mypy_cache", ".pytest_cache", ".ruff_cache", "*.egg-info",

    # Go module cache, whose entries are <module>@<version>
    "*@v*",

    # Windows marks these hidden with a file attribute rather than a dot
    # prefix, so index_hidden_dirs below can't catch them
    "AppData", "$Recycle.Bin",
]

# Dot-prefixed directories (.cursor, .pyenv, .npm) hold tool state, and on
# a home directory they outnumber everything else. Set true to walk them.
# A hidden directory named on the command line is always walked.
index_hidden_dirs = false
# Directories skipped by a marker file inside them, whatever they're named.
# A virtualenv always has pyvenv.cfg at its root but can be called
# anything, which no name pattern covers reliably.
ignore_dir_markers = [
    "pyvenv.cfg",
]

# File-name glob patterns, matched the same way .gitignore patterns are.
ignore_patterns = [
    ".DS_Store",
    ".env",
    ".env.*",
    "Thumbs.db",
    "desktop.ini",
]

# Per-extension overrides on max_file_size_mb, keyed without a leading dot
# and matched case-insensitively. Formats that carry their own media are
# mostly container - a PDF's page images, a docx's pictures, a photo's full
# sensor resolution - so they need far more room than source files.
#
# Images are generous because embedding one costs the same whatever its
# size: CLIP resizes everything to 224x224 before it looks at it, so a
# tight limit there drops photos without saving any work.
#
# This table has to stay at the end of [index]: everything after a TOML
# sub-table header belongs to that sub-table.
[index.max_file_size_mb_by_type]
pdf  = 50
docx = 25
jpg  = 50
jpeg = 50
png  = 50
heic = 50
heif = 50

[search]
# Default result counts for `scout find`, overridable per-call with
# --max/--media-max. The two are independent - matching files and matching
# media are separate result sets, never merged or compared against each
# other.
max_results = 5
max_media_results = 5
