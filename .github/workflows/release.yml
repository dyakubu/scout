name: release

# Builds a self-contained scout archive per platform (binary + models +
# onnxruntime + the media worker and its own Python interpreter, see
# scripts/package-release.sh) and attaches them as draft release assets.
# CGO rules out cross-compiling from one machine, so each platform is built
# natively on its own runner.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon runner
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CGO_ENABLED=1 is required (onnxruntime_go is a real cgo binding,
      # not just a dynamically-loaded library), and Windows runners don't
      # ship a cgo-compatible C compiler by default the way macOS
      # (clang, via Xcode CLT) and Linux (gcc) runner images do.
      #
      # msys2/setup-msys2, not Chocolatey's "mingw" package: the latter's
      # own upgrade hook script (bundled in the choco package itself, not
      # anything in this workflow) fails on current windows-latest images
      # trying to remove a file its own installed layout no longer has -
      # an upstream packaging bug, not something fixable from here.
      # setup-msys2 manages its own toolchain independently of Chocolatey.
      - name: Set up MSYS2 with MinGW-w64 (for cgo)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      # setup-msys2 doesn't add its toolchain to the general Windows PATH -
      # only to its own MSYS2 shell environment - so steps below running
      # under `shell: bash` (Git Bash, not MSYS2's shell) need this added
      # explicitly to find gcc.
      - name: Add MinGW-w64 to PATH
        if: matrix.goos == 'windows'
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      # Installs the media worker's dependencies into the bundled Python
      # interpreter at packaging time. A build tool only: the released
      # archive needs neither uv nor Python on the user's machine. Pinned
      # exactly, since setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.1.0

      - name: Fetch runtime dependencies (onnxruntime, CLIP model, python)
        shell: bash
        run: scripts/fetch-deps.sh

      - name: Build and package release archive
        shell: bash
        env:
          CGO_ENABLED: 1
        run: VERSION=${{ github.ref_name }} scripts/package-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Draft, not published, so the release notes and assets get a manual
      # once-over before anyone can download them.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
