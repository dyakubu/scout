[project]
name = "media"
version = "0.1.0"
description = "scout's media (image/video) embedding worker"
readme = "README.md"
requires-python = ">=3.11"
# Inference runs on ONNX Runtime rather than torch/transformers: same CLIP
# ViT-B/32 model, ~5x smaller install, ~8x faster worker startup. See
# clip.py's module docstring.
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pillow>=10.0",
    # HEIC is the default photo format on iPhone and on macOS screenshots.
    # Pillow has no HEIF support of its own; the wheels here bundle libheif,
    # so nothing is needed on the user's machine.
    "pillow-heif>=0.15",
    "tokenizers>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
